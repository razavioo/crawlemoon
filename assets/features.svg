<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Crawlify capabilities">
  <!-- warm paper, matching hero -->
  <rect width="1200" height="480" fill="#f4efe6"/>

  <!-- top rule + caption -->
  <line x1="64" y1="56" x2="1136" y2="56" stroke="#1a1a1a" stroke-opacity="0.18" stroke-width="0.75"/>
  <text x="64" y="44" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#1a1a1a" fill-opacity="0.55" letter-spacing="2">
    №&#160;02 &#160;·&#160; CAPABILITIES
  </text>
  <text x="1136" y="44" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#c1502e" letter-spacing="2" text-anchor="end">
    55 &#160;TOOLS &#160;· &#160;ONE &#160;SERVER
  </text>

  <!-- section heading -->
  <text x="64" y="118" font-family="'Iowan Old Style', 'Palatino', 'Georgia', serif" font-size="44" font-weight="500" fill="#171717" letter-spacing="-1">
    Four moves your agent gets for free.
  </text>

  <!-- four columns -->
  <g font-family="-apple-system, 'Helvetica Neue', Inter, sans-serif">

    <!-- column 1: SEE -->
    <g transform="translate(64, 192)">
      <!-- icon: an eye-like minimal mark = magnifier on a curve -->
      <g stroke="#171717" stroke-width="1.5" fill="none">
        <circle cx="14" cy="14" r="10"/>
        <line x1="22" y1="22" x2="32" y2="32"/>
      </g>
      <text x="0" y="68" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#c1502e" letter-spacing="2">I.&#160;SEE</text>
      <text x="0" y="100" font-family="'Iowan Old Style', 'Palatino', serif" font-size="22" fill="#171717" font-weight="500">Deep analysis</text>
      <text x="0" y="128" font-size="13" fill="#1a1a1a" fill-opacity="0.7">
        <tspan x="0" dy="0">Auto-discover REST + GraphQL</tspan>
        <tspan x="0" dy="18">endpoints. Detect bot-protection</tspan>
        <tspan x="0" dy="18">vendors. Fingerprint the stack.</tspan>
        <tspan x="0" dy="18">Deobfuscate JavaScript.</tspan>
      </text>
    </g>

    <!-- divider -->
    <line x1="320" y1="192" x2="320" y2="392" stroke="#1a1a1a" stroke-opacity="0.15" stroke-width="0.75"/>

    <!-- column 2: REACH -->
    <g transform="translate(352, 192)">
      <!-- icon: a curve threading two posts (mini version of hero metaphor) -->
      <g stroke="#171717" stroke-width="1.5" fill="none" stroke-linecap="round">
        <line x1="2" y1="0" x2="2" y2="32"/>
        <line x1="22" y1="0" x2="22" y2="32"/>
        <path d="M -4 16 C 6 6, 18 26, 28 16"/>
      </g>
      <text x="0" y="68" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#c1502e" letter-spacing="2">II.&#160;REACH</text>
      <text x="0" y="100" font-family="'Iowan Old Style', 'Palatino', serif" font-size="22" fill="#171717" font-weight="500">Stealth &amp; proxies</text>
      <text x="0" y="128" font-size="13" fill="#1a1a1a" fill-opacity="0.7">
        <tspan x="0" dy="0">curl-cffi TLS fingerprinting,</tspan>
        <tspan x="0" dy="18">rotating proxies with sticky-</tspan>
        <tspan x="0" dy="18">domain, randomized UAs, and</tspan>
        <tspan x="0" dy="18">adaptive 429/503 backoff.</tspan>
      </text>
    </g>

    <line x1="608" y1="192" x2="608" y2="392" stroke="#1a1a1a" stroke-opacity="0.15" stroke-width="0.75"/>

    <!-- column 3: REPLAY -->
    <g transform="translate(640, 192)">
      <!-- icon: dot-line-dot, "record then replay" -->
      <g stroke="#171717" stroke-width="1.5" fill="none">
        <circle cx="6" cy="16" r="4" fill="#171717"/>
        <line x1="14" y1="16" x2="26" y2="16"/>
        <polyline points="22,11 28,16 22,21"/>
      </g>
      <text x="0" y="68" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#c1502e" letter-spacing="2">III.&#160;REPLAY</text>
      <text x="0" y="100" font-family="'Iowan Old Style', 'Palatino', serif" font-size="22" fill="#171717" font-weight="500">Record → crawler</text>
      <text x="0" y="128" font-size="13" fill="#1a1a1a" fill-opacity="0.7">
        <tspan x="0" dy="0">Walk a flow once in a real</tspan>
        <tspan x="0" dy="18">browser; export it as runnable</tspan>
        <tspan x="0" dy="18">Python. The agent demos it,</tspan>
        <tspan x="0" dy="18">you ship the scraper.</tspan>
      </text>
    </g>

    <line x1="896" y1="192" x2="896" y2="392" stroke="#1a1a1a" stroke-opacity="0.15" stroke-width="0.75"/>

    <!-- column 4: SHAPE -->
    <g transform="translate(928, 192)">
      <!-- icon: messy cluster reduced to a clean column of dots -->
      <g fill="#171717">
        <circle cx="2" cy="6" r="1.6"/>
        <circle cx="9" cy="2" r="1.6"/>
        <circle cx="6" cy="14" r="1.6"/>
        <circle cx="13" cy="20" r="1.6"/>
        <circle cx="3" cy="26" r="1.6"/>
      </g>
      <g fill="#c1502e">
        <circle cx="28" cy="4" r="1.8"/>
        <circle cx="28" cy="14" r="1.8"/>
        <circle cx="28" cy="24" r="1.8"/>
      </g>
      <line x1="18" y1="14" x2="24" y2="14" stroke="#171717" stroke-width="1.2"/>
      <text x="0" y="68" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#c1502e" letter-spacing="2">IV.&#160;SHAPE</text>
      <text x="0" y="100" font-family="'Iowan Old Style', 'Palatino', serif" font-size="22" fill="#171717" font-weight="500">Smart extract</text>
      <text x="0" y="128" font-size="13" fill="#1a1a1a" fill-opacity="0.7">
        <tspan x="0" dy="0">Pattern-based by default.</tspan>
        <tspan x="0" dy="18">Optional LLM via any OpenAI-</tspan>
        <tspan x="0" dy="18">compatible API — free tiers,</tspan>
        <tspan x="0" dy="18">local Ollama, no lock-in.</tspan>
      </text>
    </g>
  </g>

  <!-- bottom rule -->
  <line x1="64" y1="424" x2="1136" y2="424" stroke="#1a1a1a" stroke-opacity="0.18" stroke-width="0.75"/>
  <text x="64" y="448" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#1a1a1a" fill-opacity="0.55" letter-spacing="2">
    Plus &#160;CDP, &#160;CAPTCHA, &#160;sessions, &#160;markdown, &#160;screenshots, &#160;perf — see README.
  </text>
</svg>
